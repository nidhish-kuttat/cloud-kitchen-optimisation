services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloud-kitchen-backend

    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloud-kitchen-frontend

    command: >
      streamlit run frontend/app.py
      --server.address 0.0.0.0
      --server.port 8501

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    depends_on:
      - backend

    environment:
      - API_URL=http://backend:8000

    restart: unless-stopped